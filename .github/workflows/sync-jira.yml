name: Sync GitHub issues to Jira

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.issue.labels.*.name, 'synced-to-jira') }}
    steps:
      - name: Map GitHub label to a Jira issue type
        id: map
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          case ",$LABELS," in
            *,bug,*) echo "issuetype=Bug" >> "$GITHUB_OUTPUT" ;;
            *,enhancement,*) echo "issuetype=Story" >> "$GITHUB_OUTPUT" ;;
            *) echo "issuetype=Task" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create Jira issue
        id: jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TYPE: ${{ steps.map.outputs.issuetype }}
        run: |
          set -euo pipefail

          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "Jira secrets are not configured on this repo yet; skipping sync." >&2
            exit 0
          fi

          DESCRIPTION="${ISSUE_BODY:-"(no description)"}

          Reported via GitHub: ${ISSUE_URL}"

          PAYLOAD=$(jq -n \
            --arg project "$JIRA_PROJECT_KEY" \
            --arg summary "$ISSUE_TITLE" \
            --arg body "$DESCRIPTION" \
            --arg issuetype "$ISSUE_TYPE" \
            '{fields: {project: {key: $project}, summary: $summary, issuetype: {name: $issuetype}, description: {type: "doc", version: 1, content: [{type: "paragraph", content: [{type: "text", text: $body}]}]}}}')

          RESPONSE=$(curl -sS -w '\n%{http_code}' -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -X POST "$JIRA_BASE_URL/rest/api/3/issue" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Jira API error ($HTTP_CODE): $BODY" >&2
            exit 1
          fi

          echo "key=$(echo "$BODY" | jq -r '.key')" >> "$GITHUB_OUTPUT"
          echo "base_url=$JIRA_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Comment and label the GitHub issue
        if: steps.jira.outputs.key != ''
        uses: actions/github-script@v7
        with:
          script: |
            const jiraKey = "${{ steps.jira.outputs.key }}";
            const jiraBaseUrl = "${{ steps.jira.outputs.base_url }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Synced to Jira: [${jiraKey}](${jiraBaseUrl}/browse/${jiraKey})`,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["synced-to-jira"],
            });
